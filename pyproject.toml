[project]
name = "agents-playground"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",
    "dotenv>=0.9.9",
    "fastmcp>=3.4.7",
    "jupyterlab>=4.6.3",
    "langchain>=1.4.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "langgraph-supervisor>=0.0.31",
    "langsmith>=0.12.2",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "python-dotenv>=1.2.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "ruff>=0.16.6",
]

[tool.ruff]
line-length = 80
include = ["pyproject.toml", "agents/**/*.py", "mcp/**/*.py"]
extend-exclude = ["*.ipynb"]

[tool.ruff.format]
exclude = ["*.ipynb"]
# Like Black, use double quotes for strings.
quote-style = "double"
# Like Black, indent with spaces, rather than tabs.
indent-style = "space"

[tool.ruff.lint]
exclude = ["*.ipynb"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"
